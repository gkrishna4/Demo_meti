---
# Ansible Inventory for Performance Troubleshooting
# 
# Define your hosts here for running performance diagnostics
#
# Example groups:
# - web: Web servers
# - db: Database servers
# - app: Application servers
# - all: All servers

all:
  children:
    web_servers:
      hosts:
        web1:
          ansible_host: 10.0.1.10
          ansible_user: ubuntu
          ansible_become: yes
        web2:
          ansible_host: 10.0.1.11
          ansible_user: ubuntu
          ansible_become: yes
    
    database_servers:
      hosts:
        db1:
          ansible_host: 10.0.2.10
          ansible_user: ubuntu
          ansible_become: yes
        db2:
          ansible_host: 10.0.2.11
          ansible_user: ubuntu
          ansible_become: yes
    
    application_servers:
      hosts:
        app1:
          ansible_host: 10.0.3.10
          ansible_user: ubuntu
          ansible_become: yes
        app2:
          ansible_host: 10.0.3.11
          ansible_user: ubuntu
          ansible_become: yes
  
  vars:
    # Global variables
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
    
    # Performance thresholds
    cpu_alert_threshold: 80
    memory_alert_threshold: 85
    disk_alert_threshold: 85
    io_wait_threshold: 20
    
    # Monitoring settings
    monitoring_interval: 5
    monitoring_duration: 30
